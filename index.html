<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PT. Investama Kalimantan Energi</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f9;}
header{background:#0b3d91;color:white;padding:20px;text-align:center;}
nav{background:#111;text-align:center;padding:10px;}
nav button{margin:5px;padding:10px;background:#333;color:white;border:none;border-radius:5px;cursor:pointer;}
nav button:hover{background:#0b3d91;}
section{display:none;padding:20px;}
.active{display:block;}
.card{background:white;padding:15px;margin-bottom:10px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
input,select{padding:8px;margin:5px;}
</style>
</head>
<body>

<header>
<h1>PT. Investama Kalimantan Energi</h1>
<p>Sistem Administrasi & Monitoring</p>
</header>

<nav>
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('data')">Data</button>
<button onclick="showPage('admin')">Login</button>
<button onclick="logout()">Logout</button>
</nav>

<!-- HOME -->
<section id="home" class="active">
<h2>Dashboard</h2>
<div class="card">Selamat datang di sistem administrasi perusahaan.</div>
</section>

<!-- DATA -->
<section id="data">
<h2>Data Administrasi</h2>

<div>
<button onclick="showJenis('po')">PO</button>
<button onclick="showJenis('sj')">Surat Jalan</button>
<button onclick="showJenis('inv')">Invoice</button>
<button onclick="showJenis('fp')">Faktur Pajak</button>
</div>

<div id="dataContainer"></div>
</section>

<!-- LOGIN / ADMIN -->
<section id="admin">
<h2>Login</h2>

<div id="loginArea">
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="adminPanel" style="display:none;">
<h3>Tambah Data</h3>

<select id="jenis">
<option value="po">PO</option>
<option value="sj">Surat Jalan</option>
<option value="inv">Invoice</option>
<option value="fp">Faktur Pajak</option>
</select>

<input type="text" id="ptname" placeholder="Nama PT (contoh: PTA)">
<input type="text" id="isiData" placeholder="Isi Data">
<button onclick="tambahData()">Tambah</button>

</div>
</section>

<script>

// DATABASE USER
const users = {
  "admin": {password:"admin123", role:"admin"},
  "pta": {password:"12345", role:"client", pt:"PTA"},
  "ptb": {password:"12345", role:"client", pt:"PTB"}
};

let currentUser = null;
let currentJenis = "po";

function showPage(id){
document.querySelectorAll("section").forEach(sec=>sec.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function login(){
let user = document.getElementById("username").value.toLowerCase();
let pass = document.getElementById("password").value;

if(users[user] && users[user].password === pass){
currentUser = users[user];
alert("Login Berhasil");

if(currentUser.role === "admin"){
document.getElementById("adminPanel").style.display="block";
}

loadData();
showPage('home');
}else{
alert("Username / Password Salah");
}
}

function logout(){
currentUser = null;
document.getElementById("adminPanel").style.display="none";
alert("Logout berhasil");
}

function showJenis(jenis){
currentJenis = jenis;
loadData();
}

function tambahData(){
if(!currentUser || currentUser.role !== "admin"){
alert("Hanya admin yang bisa tambah data");
return;
}

let jenis = document.getElementById("jenis").value;
let pt = document.getElementById("ptname").value.toUpperCase();
let isi = document.getElementById("isiData").value;

let semuaData = JSON.parse(localStorage.getItem("db")) || [];
semuaData.push({jenis, pt, isi});
localStorage.setItem("db", JSON.stringify(semuaData));

alert("Data berhasil ditambahkan");
loadData();
}

function loadData(){
let semuaData = JSON.parse(localStorage.getItem("db")) || [];
let html = "";

semuaData.forEach(d=>{
if(currentUser && (currentUser.role==="admin" || d.pt===currentUser.pt)){
if(d.jenis===currentJenis){
html += `<div class="card"><b>${d.pt}</b> - ${d.isi}</div>`;
}
}
});

document.getElementById("dataContainer").innerHTML = html;
}

</script>

</body>
</html>
